<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0E2849"/>
      <stop offset="60%" stop-color="#071322"/>
      <stop offset="100%" stop-color="#03080F"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#805A10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.6"/>

  <!-- Crescent Moon -->
  <path d="M 270 120 A 130 130 0 1 0 370 290 A 110 110 0 1 1 270 120 Z" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Star -->
  <polygon points="340,170 350,195 375,195 355,210 362,235 340,220 318,235 325,210 305,195 330,195" fill="#FFEAA7"/>

  <!-- Mosque Dome Base & Minaret Silhouette -->
  <path d="M 176 390 C 176 310 256 260 256 260 C 256 260 336 310 336 390 Z" fill="url(#gold)" opacity="0.95"/>
  <rect x="190" y="390" width="132" height="40" fill="url(#gold)" rx="4"/>
  
  <!-- Minarets -->
  <rect x="130" y="270" width="18" height="160" fill="url(#gold)" rx="3" opacity="0.85"/>
  <polygon points="139,235 125,270 153,270" fill="url(#gold)"/>
  
  <rect x="364" y="270" width="18" height="160" fill="url(#gold)" rx="3" opacity="0.85"/>
  <polygon points="373,235 359,270 387,270" fill="url(#gold)"/>

  <!-- Arch Door -->
  <path d="M 236 430 L 236 350 C 236 338 276 338 276 350 L 276 430 Z" fill="#071322"/>
</svg>
